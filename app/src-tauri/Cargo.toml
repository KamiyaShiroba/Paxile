[package]
name = "paxile-app"
version = "0.1.0"
edition = "2021"
description = "Paxile tray app and settings UI"

[lib]
name = "paxile_app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tokio = { version = "1", features = ["sync"] }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Shared config model, so the UI writes exactly what the engine reads.
paxile-policy = { path = "../../crates/policy" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }
