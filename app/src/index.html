<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Paxile</title><link rel="stylesheet" href="styles.css"></head><body><div class="app" id="app-shell"><header class="topbar" data-tauri-drag-region><div class="brand" data-tauri-drag-region><img class="brand-mark" src="/icon.png" alt="" draggable="false"><span data-tauri-drag-region>Paxile</span></div><nav class="tabs" aria-label="主导航"><button class="tab is-active" type="button" data-page="intercept" aria-current="page">拦截</button><button class="tab" type="button" data-page="settings">设置</button></nav><div class="top-actions"><button class="icon-button" id="add-button" type="button" aria-label="添加拦截规则" data-tooltip="添加拦截规则"><span class="tabler-icon-root" data-icon="plus" aria-hidden="true"></span></button><label class="toggle" data-tooltip="全局拦截"><span class="sr-only">全局拦截</span><input id="global-toggle" type="checkbox"><span class="toggle-track"><span></span></span></label></div></header><main><section class="page is-visible" data-page-panel="intercept"><div class="page-heading"><div><p class="eyebrow">ACTIVE RULES</p><h1>拦截</h1></div><span class="rule-count" id="rule-count">0 条规则</span></div><div class="rule-list" id="rule-list"></div><div class="empty-state" id="empty-state"><span class="empty-icon"><span class="tabler-icon-root" data-icon="shield" aria-hidden="true"></span></span><h2>还没有拦截规则</h2><p>添加软件以开始拦截输入法行为。</p><button class="button primary" type="button" data-open-modal>添加规则</button></div></section><section class="page" data-page-panel="settings" hidden><div class="page-heading"><div><p class="eyebrow">PREFERENCES</p><h1>设置</h1></div></div><div class="settings-card"><div class="setting-row"><div><h2>开机自动启动</h2><p>登录 Windows 后自动运行 Paxile。</p></div><label class="toggle"><span class="sr-only">开机自动启动</span><input id="autostart" type="checkbox"><span class="toggle-track"><span></span></span></label></div><div class="setting-row"><div><h2>静默启动</h2><p>启动时不打开设置窗口。</p></div><label class="toggle"><span class="sr-only">静默启动</span><input id="silent-start" type="checkbox"><span class="toggle-track"><span></span></span></label></div></div><div class="update-card" aria-labelledby="update-title"><div class="card-heading"><div><h2 id="update-title">软件更新</h2><span id="update-version">当前版本：检查中…</span></div><button class="button" id="check-update" type="button">检查更新</button></div><p id="update-status" role="status"></p><div id="update-details" hidden><h3>发布说明</h3><pre id="release-notes"></pre><button class="button primary" id="install-update" type="button">确认更新</button></div></div><div class="log-card"><div class="card-heading"><div><p class="eyebrow">LIVE</p><h2>实时日志</h2></div><span class="live-dot" aria-label="实时"></span></div><div class="log-list" id="log-list" role="log" aria-live="polite"></div></div></section></main></div>
<div class="modal-backdrop" id="rule-modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title">添加拦截规则</h2><button class="icon-button" id="close-modal" type="button" aria-label="关闭" data-tooltip="关闭"><span class="tabler-icon-root" data-icon="close" aria-hidden="true"></span></button></div><div class="choice-grid"><label class="choice is-selected"><input type="radio" name="rule-type" value="preset" checked><span><strong>软件预设</strong><small>选择已适配的软件</small></span></label><label class="choice"><input type="radio" name="rule-type" value="custom"><span><strong>自定义程序</strong><small>输入可执行文件名</small></span></label></div><label class="field-label" id="software-field-label" for="software-select">软件</label><select id="software-select"></select><input class="text-field" id="custom-executable" type="text" placeholder="例如 game.exe" autocomplete="off" hidden><div class="modal-actions"><button class="button" id="cancel-modal" type="button">取消</button><button class="button primary" id="confirm-modal" type="button">添加</button></div></section></div><div class="modal-backdrop" id="update-modal" hidden><section class="modal" role="dialog" aria-modal="true" aria-labelledby="update-confirm-title" aria-describedby="update-confirm-copy"><div class="modal-header"><h2 id="update-confirm-title">确认更新</h2><button class="icon-button" id="close-update" type="button" aria-label="关闭更新确认" data-tooltip="关闭"><span class="tabler-icon-root" data-icon="close" aria-hidden="true"></span></button></div><p id="update-confirm-copy">确认后将下载安装包并静默安装。更新时 Paxile 可能退出，请先保存工作。</p><div class="modal-actions"><button class="button" id="cancel-update" type="button">取消</button><button class="button primary" id="confirm-update" type="button">确认更新</button></div></section></div><script type="module" src="icons.jsx"></script></body></html>
